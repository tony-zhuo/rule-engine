# Config for cmd/apis (the rule-admin control plane).
#
# cmd/rule-engine-core and cmd/event-producer are configured entirely through
# environment variables instead — see the README for the full list
# (SHARD_ID, NATS_URL, SNAPSHOT_DIR, BACKEND, KAFKA_BROKERS, ...).

app:
  addr: ":8080"

db:
  host: "localhost"
  user: "rule_engine"
  password: "rule_engine"
  dbname: "rule_engine"
  port: 5432
  sslmode: "disable"
  timezone: "UTC"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime_sec: 300

log:
  level: "info"
